<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Delving Dungeons Character Creator</title>

        <!-- links to css and js files -->
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Delving Dungeons Character Creator</h1>
        </header>

        <main>
            <h2>Character Creation</h2>
            
            <!-- method is post because we are submitting data to the server -->
            <!-- action is # because we are submitting to the same page -->
            <form name = "characterForm" id = "characterForm" method="post" action="#"> 
                <!-- your name area -->
                <div id ="playerNameDiv">
                    <label for="playerName">Your Name:</label>
                    <input type="text" id="playerName" name="playerName" placeholder="Player Name" required><span class ="red">  *</span>
                </div>

                <!-- characters name -->
                <div id="characterNameDiv">
                    <label for="characterName">Character Name:</label>
                    <input type="text" id="characterName" name="characterName" placeholder="Character Name">
                </div>

                <!-- character class -->
                <div id="characterClassDiv">
                    <label for="characterClass">Character Class:</label>

                    <!-- character class options -->
                    <select id="characterClass" name="characterClass">
                        <option value="warrior">Warrior</option>
                        <option value="mage">Mage</option>
                        <option value="rogue">Rogue</option>
                        <option value="cleric">Cleric</option>
                    </select>
                </div>

                <!-- character weapon choice -->
                <div id="characterWeaponDiv">
                    <label for="characterWeapon">Character Weapon:</label>
                    <select id="characterWeapon" name="characterWeapon">
                        <option value="sword">Sword</option>
                        <option value="staff">Staff</option>
                        <option value="dagger">Dagger</option>
                        <option value="bow">Bow</option>
                    </select>
                </div>

                <!-- submit button -->
                <div>
                    <label for="submit"></label>
                    <input type="submit" onclick="processForm(event);" value="Submit App">
                </div>            
            </form>
            
            <!-- required field indicator -->
            <div><span class = "red">*</span> Indicates a required field</div>

            <!-- text display area -->
            <div class ="divInfo" id = "divInfo">
                <h3>Character Information</h3>
                <textarea id = "txtOutput" readonly></textarea>
            </div>          
        </main>
    </body>
</html>
